<!DOCTYPE html>
<html>
<head>
    <title>Student Information</title>
<head>
<body>

    <h1>Student Information</h1>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="student_name":>Student Name:</label>
        <input type="text" id="student_name" name="student_name">
        <br><br>

        <label for="student_id">Student ID:</label>
        <input type="text" id="student_id" name="student_id">
        <br><br>

        <label for="major">Major:</label>
        <select id="major" name="major">
            <option value="Software Development">Software Development</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Computer Science">Computer Science</option>
        </select>
        <br><br>
        
        <label>Class Standing:</label><br>

        <input type="radio" id="freshman" name="class_standing" value="Freshman">
        <label for="freshman">Freshman</label><br>

        <input type="radio" id="sophomore" name="class_standing" value="Sophomore">
        <label for="sophomore">Sophomore</label><br>

        <input type="radio" id="junior" name="class_standing" value="Junior">
        <label for="junior">Junior</label><br>

        <input type="radio" id="senior" name="class_standing" value="Senior">
        <label for="senior">Senior</label>
        <br><br>

        <label>Programming Languages Known:</label><br>

        <input type="checkbox" id="python" name="languages" value="Python">
        <label for="python">Python</label><br>

        <input type="checkbox" id="java" name="languages" value="Java">
        <label for="java">Java</label><br>

        <input type="checkbox" id="cpp" name="languages" value="C++">
        <label for="cpp">C++</label><br>

        <input type="checkbox" id="javascript" name="languages" value="JavaScript">
        <label for="javascript">JavaScript</label>
        <br><br>

        <label for="graduation_year">Expected Graduation Year:</label>
        <input type="number" id="graduation_year" name="graduation_year">
        <br><br>

        <label for="comments">Comments:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
